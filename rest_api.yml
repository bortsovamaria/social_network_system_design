openapi: 3.2.0
info:
  title: Приложение для путешественников
  termsOfService: https://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.13

externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: https://petstore32.swagger.io/api/v3
    description: Production server (OAS 3.2)
  - url: https://petstore-staging.swagger.io/api/v3
    description: Staging server
tags:
  - name: post
    description: Everything about posts
  - name: image
    description: Image
  - name: rate
    description: Rating of posts
  - name: comment
    description: Comment
  - name: subscription
    description: Subscription
  - name: place
    description: Places
  - name: feed
    description: Feed of posts

paths:

  /posts:
    post:
      tags:
        - post
      summary: Add post
      description: Add post
      operationId: addPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{postId}:
    get:
      tags:
        - post
      summary: Get post
      description: Get post
      operationId: getPost
      parameters:
        - name: postId
          in: path
          description: ID of post to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - post
      summary: Delete post.
      description: delete post.
      operationId: deletePost
      parameters:
        - name: postId
          in: path
          description: Post id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid pet value
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /posts/{placeId}:
    get:
      tags:
        - post
      summary: Get posts
      description: Get posts
      operationId: getPostsByPlace
      parameters:
        - name: placeId
          in: path
          description: ID of place to return posts
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /uploadImage:
    post:
      tags:
        - image
      summary: Uploads
      description: Upload an image
      operationId: uploadFile
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rate/{postId}:
    post:
      tags:
        - rate
      summary: Add rate
      description: Add rate
      operationId: addRate
      parameters:
        - name: postId
          in: path
          description: ID of post
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rate'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rate'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /comment/{postId}:
    post:
      tags:
        - comment
      summary: Add comment
      description: Add comment
      operationId: addComment
      parameters:
        - name: postId
          in: path
          description: ID of post
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /subscriptions:
    post:
      tags:
        - subscription
      summary: Subscription
      description: Subscription
      operationId: addSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /subscriptions/{subscriptionId}/user/{userId}:
    delete:
      tags:
        - subscription
      summary: Delete susbscription.
      description: delete susbscription.
      operationId: deleteSubscription
      parameters:
        - name: subscriptionId
          in: path
          description: susbscription id to delete
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          description: user id for remove subscription
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid susbscription value
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /feed/{userId}:
    get:
      tags:
        - feed
      summary: Get Feed
      description: Get Feed
      operationId: getFeed
      parameters:
        - name: userId
          in: path
          description: user id for get feed
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /places/search:
    get:
      tags:
        - place
      summary: Search places
      description: Search places
      operationId: searchPlaces
      parameters:
        - name: name
          in: query
          description: place name
          required: false
          schema:
            type: string
        - name: place id
          in: query
          description: place id
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Number of results to skip for pagination
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Search results with pagination metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  total:
                    type: integer
                    description: Total number of matching results
                  limit:
                    type: integer
                    description: Maximum results per page
                  offset:
                    type: integer
                    description: Current offset
                  hasMore:
                    type: boolean
                    description: Whether there are more results available
              examples:
                searchResults:
                  summary: Example search results
                  value:
                    results:
                      - id: 10
                        name: "Moscow"
                        descirption: "Descirption"
                        photoUrls:
                          - "https://example.com/photos/moscow-v1.jpg"
                    total: 42
                    limit: 20
                    offset: 0
                    hasMore: true
        '400':
          description: Invalid search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: 1
        description:
          type: string
          description: Description travel
          examples: [About travel]
        photoUrls:
          type: array
          items:
            type: string
        placeId:
          type: integer
          format: int64
          examples: 10
        createdAt:
          type: string
          format: datetime

    Image:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: 326
        url:
          type: string
          examples: [s3.example-url-v1.com]
        createdAt:
          type: string
          format: datetime

    Rate:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: 1
        userId:
          type: integer
          description: int64
          examples: 4242
        postId:
          type: integer
          format: int64
          examples: 123
        rating:
          type: integer
          format: int64
          examples: 7

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: 1
        userId:
          type: integer
          description: int64
          examples: 4242
        postId:
          type: integer
          format: int64
          examples: 123
        text:
          type: integer
          format: int64
          examples: 7
        createdAt:
          type: string
          format: datetime

    Subscription:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: 1
        userId:
          type: integer
          description: int64
          examples: 4242
        toUserId:
          type: integer
          format: int64
          examples: 7
        createdAt:
          type: string
          format: datetime

    Place:
      type: object
      properties:
        id:
          type: integer
          format: int64
          examples: 326
        name:
          type: string
          examples: [Moscow]
        description:
          type: string
          examples: [Descirption]
        photoUrls:
          type: array
          items:
            type: string
        rate:
          type: integer
          format: int64
          examples: 326
        createdAt:
          type: string
          format: datetime

    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message